<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Região do 2º COB | Projeto CNPq Fogo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            background: #f7f5ef;
        }

        .map-shell {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            gap: 18px;
            width: 100%;
            height: 100%;
            padding: 14px;
            box-sizing: border-box;
        }

        .map-sidebar {
            align-self: stretch;
            padding: 22px 18px;
            overflow-y: auto;
            background: #fffdf8;
            border: 1px solid #d8d2c5;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .sidebar-section + .sidebar-section {
            margin-top: 22px;
            padding-top: 19px;
            border-top: 1px dashed #cfc8ba;
        }

        .sidebar-title {
            margin: 0 0 12px;
            color: #6a716d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .layer-option {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            padding: 9px 0;
            border-bottom: 1px solid #e2ddd2;
            font-size: 13px;
            line-height: 1.35;
            cursor: pointer;
        }

        .layer-option:last-child {
            border-bottom: 0;
        }

        .layer-option input {
            margin: 2px 0 0;
            accent-color: #1e4d45;
        }

        .data-description {
            margin: 0 0 14px;
            color: #777b78;
            font-size: 12px;
            line-height: 1.6;
        }

        .download-data {
            display: block;
            padding: 11px 12px;
            color: #fff;
            background: #244d46;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }

        .map-area {
            position: relative;
            min-width: 0;
            overflow: hidden;
            background: #fff;
            border: 1px solid #d8d2c5;
            border-radius: 6px;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-status {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 900;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #ddd;
            font-size: 13px;
            transform: translate(-50%, -50%);
        }

        .sigla-estado {
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            line-height: 20px;
            text-align: center;
            text-shadow:
                -1px -1px 2px #000,
                 1px -1px 2px #000,
                -1px  1px 2px #000,
                 1px  1px 2px #000;
            pointer-events: none;
        }

        @media (max-width: 700px) {
            body {
                overflow: auto;
            }

            .map-shell {
                grid-template-columns: 1fr;
                grid-template-rows: auto 480px;
                height: auto;
                min-height: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="map-shell">
        <aside class="map-sidebar" aria-label="Camadas e dados do mapa">
            <section class="sidebar-section">
                <h2 class="sidebar-title">Camadas</h2>
                <label class="layer-option">
                    <input id="overlayProjeto" type="checkbox" checked>
                    <span>Região do 2º COB</span>
                </label>
                <label class="layer-option">
                    <input id="overlayEstados" type="checkbox" checked>
                    <span>Limites estaduais</span>
                </label>
            </section>

            <section class="sidebar-section">
                <h2 class="sidebar-title">Mapa-base</h2>
                <label class="layer-option">
                    <input type="radio" name="baseMap" value="osm" checked>
                    <span>OpenStreetMap</span>
                </label>
                <label class="layer-option">
                    <input type="radio" name="baseMap" value="satelite">
                    <span>Imagem de satélite</span>
                </label>
                <label class="layer-option">
                    <input type="radio" name="baseMap" value="topografico">
                    <span>OpenTopoMap</span>
                </label>
            </section>

            <section class="sidebar-section">
                <h2 class="sidebar-title">Dados brutos</h2>
                <p class="data-description">
                    Baixe a área de interesse do Projeto CNPq Fogo em formato GeoJSON.
                </p>
                <a class="download-data" href="../../dados/regiao2cob.geojson" download>
                    Baixar GeoJSON &#8599;
                </a>
            </section>
        </aside>

        <div class="map-area">
            <div id="map"></div>
            <div id="mapStatus" class="map-status">Carregando camadas...</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', {
            zoomControl: true,
            scrollWheelZoom: true
        });

        const esriSatelite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri — Sources: Esri, Maxar, Earthstar Geographics e colaboradores'
            }
        );

        const openStreetMap = L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        const openTopoMap = L.tileLayer(
            'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 17,
                attribution: '&copy; OpenStreetMap contributors · OpenTopoMap (CC-BY-SA)'
            }
        );

        const mapasBase = {
            osm: openStreetMap,
            satelite: esriSatelite,
            topografico: openTopoMap
        };

        let mapaBaseAtual = openStreetMap;

        document.querySelectorAll('input[name="baseMap"]').forEach(input => {
            input.addEventListener('change', event => {
                if (!event.target.checked) return;
                map.removeLayer(mapaBaseAtual);
                mapaBaseAtual = mapasBase[event.target.value];
                mapaBaseAtual.addTo(map);
                mapaBaseAtual.bringToBack();
            });
        });

        function carregarGeoJSON(caminho) {
            return fetch(caminho)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Arquivo não encontrado: ' + caminho);
                    }
                    return response.text();
                })
                .then(texto => {
                    const conteudo = texto.trim();

                    if (!conteudo) {
                        throw new Error('O arquivo está vazio: ' + caminho);
                    }

                    try {
                        return JSON.parse(conteudo);
                    } catch (erro) {
                        const feicoes = conteudo
                            .split(/\r?\n/)
                            .filter(linha => linha.trim())
                            .map(linha => JSON.parse(linha));

                        return {
                            type: 'FeatureCollection',
                            features: feicoes
                        };
                    }
                });
        }

        Promise.all([
            carregarGeoJSON('../../dados/regiao2cob.geojson'),
            carregarGeoJSON('../../dados/limites_estados.geojsonl')
        ])
        .then(([dados2COB, dadosEstados]) => {
            const regiao2COB = L.geoJSON(dados2COB, {
                style: {
                    color: '#ff0000',
                    weight: 3,
                    opacity: 1,
                    fillColor: '#ff0000',
                    fillOpacity: 0.08
                },
                onEachFeature: (feature, layer) => {
                    const area = feature.properties && feature.properties.Area_Km2
                        ? Number(feature.properties.Area_Km2).toLocaleString('pt-BR', {
                            maximumFractionDigits: 0
                        })
                        : null;

                    let conteudo = '<strong>Região do 2º COB</strong>' +
                        '<br>Área de interesse do Projeto CNPq Fogo';

                    if (area) {
                        conteudo += '<br>Área: ' + area + ' km²';
                    }

                    layer.bindPopup(conteudo);
                }
            }).addTo(map);

            const estados = L.layerGroup();
            const marcadoresSiglas = [];

            const limitesEstados = L.geoJSON(dadosEstados, {
                style: {
                    color: '#ffffff',
                    weight: 1.5,
                    opacity: 0.95,
                    fill: false,
                    fillOpacity: 0
                },
                onEachFeature: (feature, layer) => {
                    const sigla = feature.properties && feature.properties.sigla
                        ? feature.properties.sigla
                        : '';

                    if (sigla) {
                        const marcador = L.marker([0, 0], {
                            interactive: false,
                            opacity: 0,
                            icon: L.divIcon({
                                className: 'sigla-estado',
                                html: sigla,
                                iconSize: [40, 20],
                                iconAnchor: [20, 10]
                            })
                        });

                        marcador.addTo(estados);
                        marcadoresSiglas.push({ marcador, camada: layer });
                    }
                }
            });

            limitesEstados.addTo(estados);
            estados.addTo(map);

            document.getElementById('overlayProjeto').addEventListener('change', event => {
                if (event.target.checked) {
                    regiao2COB.addTo(map);
                } else {
                    map.removeLayer(regiao2COB);
                }
            });

            document.getElementById('overlayEstados').addEventListener('change', event => {
                if (event.target.checked) {
                    estados.addTo(map);
                    atualizarPosicaoSiglas();
                } else {
                    map.removeLayer(estados);
                }
            });

            function atualizarPosicaoSiglas() {
                if (!map.getCenter()) {
                    return;
                }

                const limitesTela = map.getBounds();

                marcadoresSiglas.forEach(item => {
                    const limitesEstado = item.camada.getBounds();

                    if (!limitesEstado.isValid() || !limitesTela.intersects(limitesEstado)) {
                        item.marcador.setOpacity(0);
                        return;
                    }

                    const sul = Math.max(
                        limitesTela.getSouth(),
                        limitesEstado.getSouth()
                    );
                    const norte = Math.min(
                        limitesTela.getNorth(),
                        limitesEstado.getNorth()
                    );
                    const oeste = Math.max(
                        limitesTela.getWest(),
                        limitesEstado.getWest()
                    );
                    const leste = Math.min(
                        limitesTela.getEast(),
                        limitesEstado.getEast()
                    );

                    item.marcador
                        .setLatLng([(sul + norte) / 2, (oeste + leste) / 2])
                        .setOpacity(1);
                });
            }

            map.fitBounds(regiao2COB.getBounds(), { padding: [22, 22] });

            L.control.scale({ imperial: false }).addTo(map);

            map.on('moveend zoomend resize overlayadd', atualizarPosicaoSiglas);
            map.whenReady(atualizarPosicaoSiglas);

            document.getElementById('mapStatus').remove();
        })
        .catch(error => {
            const status = document.getElementById('mapStatus');
            status.textContent = 'Não foi possível carregar o mapa: ' + error.message;
            map.setView([-18.5, -48.5], 7);
            console.error(error);
        });
    </script>
</body>
</html>
