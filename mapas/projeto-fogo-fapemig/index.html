<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Serra da Canastra | Projeto FAPEMIG Fogo</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        .map-title {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 800;
            max-width: 290px;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #d8d8d8;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        .map-title strong {
            display: block;
            margin-bottom: 3px;
            font-size: 14px;
        }

        .map-title span {
            color: #555;
            font-size: 11px;
            line-height: 1.4;
        }

        .map-status {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 900;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #ddd;
            font-size: 13px;
            transform: translate(-50%, -50%);
        }

        .download-data {
            display: inline-block;
            margin-top: 8px;
            color: #111;
            font-size: 11px;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .leaflet-control-layers {
            border-radius: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        }

        /* Siglas dos estados */
        .sigla-estado {
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            line-height: 20px;
            text-align: center;
            text-shadow:
                -1px -1px 2px #000,
                 1px -1px 2px #000,
                -1px  1px 2px #000,
                 1px  1px 2px #000;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .map-title {
                right: 10px;
                left: 52px;
                max-width: none;
            }
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="map-title">
        <strong>Parque Nacional da Serra da Canastra</strong>

        <span>
            Área de interesse do Projeto FAPEMIG Fogo
        </span>

        <br>

        <a
            class="download-data"
            href="../../dados/canastra.geojson"
            download
        >
            Baixar GeoJSON
        </a>
    </div>

    <div id="mapStatus" class="map-status">
        Carregando camadas...
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map', {
            zoomControl: true,
            scrollWheelZoom: true
        });

        /* Mapas-base */

        const esriSatelite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                maxZoom: 19,
                attribution:
                    'Tiles &copy; Esri — Sources: Esri, Maxar, Earthstar Geographics e colaboradores'
            }
        ).addTo(map);

        const openStreetMap = L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        );

        const openTopoMap = L.tileLayer(
            'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 17,
                attribution:
                    '&copy; OpenStreetMap contributors · OpenTopoMap (CC-BY-SA)'
            }
        );

        /*
         * Essa função aceita tanto GeoJSON convencional
         * quanto GeoJSONL, com uma feição em cada linha.
         */
        function carregarGeoJSON(caminho) {
            return fetch(caminho)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(
                            'Arquivo não encontrado: ' + caminho
                        );
                    }

                    return response.text();
                })

                .then(texto => {
                    const conteudo = texto.trim();

                    if (!conteudo) {
                        throw new Error(
                            'O arquivo está vazio: ' + caminho
                        );
                    }

                    /*
                     * Primeiro tenta interpretar o arquivo
                     * como um GeoJSON convencional.
                     */
                    try {
                        return JSON.parse(conteudo);
                    }

                    /*
                     * Se não funcionar, interpreta cada linha
                     * como uma feição GeoJSON separada.
                     */
                    catch (erro) {
                        const feicoes = conteudo
                            .split(/\r?\n/)
                            .filter(linha => linha.trim())
                            .map(linha => JSON.parse(linha));

                        return {
                            type: 'FeatureCollection',
                            features: feicoes
                        };
                    }
                });
        }

        Promise.all([
            carregarGeoJSON('../../dados/canastra.geojson'),
            carregarGeoJSON('../../dados/limites_estados.geojsonl')
        ])

        .then(([dadosCanastra, dadosEstados]) => {
            /* Área da Canastra */

            const canastra = L.geoJSON(dadosCanastra, {
                style: {
                    color: '#ff0000',
                    weight: 2,
                    opacity: 1,
                    fillColor: '#d86b3d',
                    fillOpacity: 0.16
                },

                onEachFeature: (feature, layer) => {
                    layer.bindPopup(
                        '<strong>Parque Nacional da Serra da Canastra</strong>' +
                        '<br>Área de interesse do Projeto FAPEMIG Fogo'
                    );
                }
            }).addTo(map);

          /* Grupo que reunirá limites e siglas */

const estados = L.layerGroup();
const marcadoresSiglas = [];

/* Limites estaduais */

const limitesEstados = L.geoJSON(dadosEstados, {
    style: {
        color: '#ffffff',
        weight: 1.5,
        opacity: 0.95,
        fill: false,
        fillOpacity: 0
    },

    onEachFeature: (feature, layer) => {
        const sigla =
            feature.properties &&
            feature.properties.sigla
                ? feature.properties.sigla
                : '';

        if (sigla) {
            const marcadorSigla = L.marker(
                [0, 0],
                {
                    interactive: false,
                    opacity: 0,

                    icon: L.divIcon({
                        className: 'sigla-estado',
                        html: sigla,
                        iconSize: [40, 20],
                        iconAnchor: [20, 10]
                    })
                }
            );

            marcadorSigla.addTo(estados);

            marcadoresSiglas.push({
                marcador: marcadorSigla,
                camada: layer
            });
        }
    }
});

limitesEstados.addTo(estados);
estados.addTo(map);

/*
 * Reposiciona cada sigla no centro da parte
 * do estado que está visível na tela.
 */

function atualizarPosicaoSiglas() {
    const limitesTela = map.getBounds();

    marcadoresSiglas.forEach(item => {
        const limitesEstado =
            item.camada.getBounds();

        /*
         * Esconde a sigla quando nenhuma parte
         * do estado estiver visível.
         */
        if (!limitesTela.intersects(limitesEstado)) {
            item.marcador.setOpacity(0);
            return;
        }

        /*
         * Calcula a interseção entre os limites
         * do estado e a área atualmente visível.
         */
        const sul = Math.max(
            limitesTela.getSouth(),
            limitesEstado.getSouth()
        );

        const norte = Math.min(
            limitesTela.getNorth(),
            limitesEstado.getNorth()
        );

        const oeste = Math.max(
            limitesTela.getWest(),
            limitesEstado.getWest()
        );

        const leste = Math.min(
            limitesTela.getEast(),
            limitesEstado.getEast()
        );

        const latitude = (sul + norte) / 2;
        const longitude = (oeste + leste) / 2;

        item.marcador
            .setLatLng([latitude, longitude])
            .setOpacity(1);
    });
}

/*
 * Atualiza as siglas sempre que o usuário
 * movimentar, ampliar ou redimensionar o mapa.
 */

map.on(
    'moveend zoomend resize',
    atualizarPosicaoSiglas
);

atualizarPosicaoSiglas();

            /* Enquadramento da Canastra */

            map.fitBounds(
                canastra.getBounds(),
                {
                    padding: [22, 22]
                }
            );

            /* Controle de camadas */

            L.control.layers(
                {
                    'Imagem de satélite — Esri': esriSatelite,
                    'OpenStreetMap': openStreetMap,
                    'OpenTopoMap': openTopoMap
                },

                {
                    'Área da Canastra': canastra,
                    'Estados': estados
                },

                {
                    collapsed: false,
                    position: 'bottomright'
                }
            ).addTo(map);

            /* Escala gráfica */

            L.control.scale({
                imperial: false
            }).addTo(map);

            /* Remove a mensagem de carregamento */

            document
                .getElementById('mapStatus')
                .remove();
        })

        .catch(error => {
            const status =
                document.getElementById('mapStatus');

            status.textContent =
                'Não foi possível carregar o mapa: ' +
                error.message;

            map.setView(
                [-20.37, -46.60],
                9
            );

            console.error(error);
        });
    </script>
</body>
</html>
